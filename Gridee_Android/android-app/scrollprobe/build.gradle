plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Compile the production file verbatim, without bringing any production app services/accounts.
def scrollBindingSource = tasks.register('syncScrollBindingSource', Sync) {
    from('../app/src/main/java') {
        include 'com/gridee/parking/ui/base/LifecycleBoundScrollListener.kt'
    }
    into(layout.buildDirectory.dir('generated/scrollBindingSource'))
}

android {
    namespace 'com.gridee.parking.scrollprobe'
    compileSdk 36
    defaultConfig {
        applicationId 'com.gridee.parking.scrollprobe'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    sourceSets.main.java.srcDir(layout.buildDirectory.dir('generated/scrollBindingSource'))
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
}

tasks.named('preBuild').configure { dependsOn(scrollBindingSource) }

dependencies {
    // Match the app's resolved runtime versions for the code exercised by this probe.
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.1'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
