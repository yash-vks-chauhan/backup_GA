plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.gms.google-services'
}

def signingProps = new Properties()
def signingPropsFile = rootProject.file("keystore.properties")
if (signingPropsFile.exists()) {
    signingPropsFile.withInputStream { signingProps.load(it) }
}

def releaseStoreFile = signingProps.getProperty("RELEASE_STORE_FILE") ?: project.findProperty("RELEASE_STORE_FILE")
def releaseStorePassword = signingProps.getProperty("RELEASE_STORE_PASSWORD") ?: project.findProperty("RELEASE_STORE_PASSWORD")
def releaseKeyAlias = signingProps.getProperty("RELEASE_KEY_ALIAS") ?: project.findProperty("RELEASE_KEY_ALIAS")
def releaseKeyPassword = signingProps.getProperty("RELEASE_KEY_PASSWORD") ?: project.findProperty("RELEASE_KEY_PASSWORD")
def isReleaseTaskRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }

// ---------------------------------------------------------------------------
// Backend base URL
//
// The Play Store build must always talk to production. PROD_BASE_URL is baked
// into the release variant unconditionally and no Gradle property can change
// it, so a stray -PgrideeBaseUrl or a forgotten line in gradle.properties can
// never ship a staging URL to live users.
//
// Only the debug variant is overridable, and it falls back to production when
// nothing is set — an unconfigured debug build behaves exactly as it did when
// the URL was a hardcoded constant in ApiConfig.kt.
//
//   ./gradlew :app:installDebug -PgrideeBaseUrl=http://192.168.1.42:8080/
//
// Set grideeFallbackBaseUrl too if you want the ApiClient retry path to reach a
// second host; leaving it unset keeps base and fallback identical, which is the
// current production behaviour (the retry is a no-op when the hosts match).
// ---------------------------------------------------------------------------
def PROD_BASE_URL = "https://gridee.onrender.com/"

def normalizeBaseUrl(String propertyName, String rawUrl) {
    def value = rawUrl?.trim()
    if (!value) {
        throw new GradleException("${propertyName} must not be blank.")
    }
    if (!value.startsWith("http://") && !value.startsWith("https://")) {
        throw new GradleException("${propertyName} must start with http:// or https:// (was: '${value}').")
    }
    // Retrofit's baseUrl() rejects any URL that does not end in '/', and it fails
    // at Retrofit construction time — i.e. app launch — so normalise it here.
    return value.endsWith("/") ? value : value + "/"
}

def debugBaseUrl = normalizeBaseUrl(
        "grideeBaseUrl",
        (project.findProperty("grideeBaseUrl") ?: PROD_BASE_URL).toString())
def debugFallbackBaseUrl = normalizeBaseUrl(
        "grideeFallbackBaseUrl",
        (project.findProperty("grideeFallbackBaseUrl") ?: debugBaseUrl).toString())

if (debugBaseUrl != PROD_BASE_URL) {
    logger.lifecycle("Gridee: debug build points at ${debugBaseUrl} (release stays on ${PROD_BASE_URL})")
}

android {
    namespace 'com.gridee.parking'
    compileSdk 36

    defaultConfig {
        applicationId "com.gridee.parking"
        minSdk 24
        targetSdk 36
        versionCode 72
        versionName "1.71"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Safety net: any variant that does not set these explicitly still gets
        // production. Both buildTypes below override it, debug conditionally.
        buildConfigField "String", "GRIDEE_BASE_URL", "\"${PROD_BASE_URL}\""
        buildConfigField "String", "GRIDEE_FALLBACK_BASE_URL", "\"${PROD_BASE_URL}\""
    }

    signingConfigs {
        release {
            if (releaseStoreFile) {
                storeFile rootProject.file(releaseStoreFile)
            }
            if (releaseStorePassword) {
                storePassword releaseStorePassword
            }
            if (releaseKeyAlias) {
                keyAlias releaseKeyAlias
            }
            if (releaseKeyPassword) {
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (isReleaseTaskRequested && (!releaseStoreFile || !releaseStorePassword || !releaseKeyAlias || !releaseKeyPassword)) {
                throw new GradleException("Release signing properties are missing. Set RELEASE_STORE_FILE, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD in keystore.properties, gradle.properties, or via -P.")
            }
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // Hardcoded on purpose. Do NOT wire a Gradle property in here: the
            // release variant is what reaches the Play Store, and it must be
            // impossible to point it anywhere but production by accident.
            buildConfigField "String", "GRIDEE_BASE_URL", "\"${PROD_BASE_URL}\""
            buildConfigField "String", "GRIDEE_FALLBACK_BASE_URL", "\"${PROD_BASE_URL}\""
        }

        debug {
            buildConfigField "String", "GRIDEE_BASE_URL", "\"${debugBaseUrl}\""
            buildConfigField "String", "GRIDEE_FALLBACK_BASE_URL", "\"${debugFallbackBaseUrl}\""
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    bundle {
        language {
            // Play delivers only the device-locale language split by default, which
            // would leave the in-app language picker with nothing to switch to.
            // Keep every locale in the base APK so hi/ta/te/ml/bn are always present.
            enableSplit = false
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    kotlinOptions {
        jvmTarget = '1.8'
    }
    
    buildFeatures {
        buildConfig true
        viewBinding true
        compose true
    }
    
    // Force 16 KB zip alignment for native libs (AGP module property).
    experimentalProperties["android.nativeLibraryAlignmentPageSize"] = "16k"
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    
    // Jetpack Compose BOM
    implementation platform('androidx.compose:compose-bom:2023.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.compose.runtime:runtime-livedata'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    
    // System UI Controller for window insets
    implementation 'com.google.accompanist:accompanist-systemuicontroller:0.32.0'
    
    // Retrofit for API calls
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.retrofit2:converter-scalars:2.9.0'
    // Explicit Gson (optional but ensures version alignment)
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    
    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    
    // SwipeRefreshLayout
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    
    // Navigation
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.5'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.5'
    implementation 'androidx.navigation:navigation-compose:2.7.5'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    
    // Lottie for animations
    implementation 'com.airbnb.android:lottie:6.1.0'

    // Coil for remote image loading (custom ad creatives)
    implementation 'io.coil-kt:coil:2.6.0'
    
    // Google Sign-In
    implementation 'com.google.android.gms:play-services-auth:20.7.0'
    // Firebase Auth (email verification + password reset)
    implementation platform('com.google.firebase:firebase-bom:32.8.1')
    implementation 'com.google.firebase:firebase-auth-ktx'
    implementation 'com.google.firebase:firebase-analytics-ktx'
    implementation 'com.google.firebase:firebase-messaging-ktx'
    // Google Mobile Ads mediation for booking-transition interstitials, Home native ads,
    // rewarded videos, and consent. Meta bundles its SDK transitively; Unity's adapter no
    // longer bundles the Unity Ads SDK, so both Unity artifacts are required explicitly.
    implementation 'com.google.android.gms:play-services-ads:25.4.0'
    implementation 'com.google.ads.mediation:facebook:6.22.0.0'
    implementation 'com.unity3d.ads:unity-ads:4.19.0'
    implementation 'com.google.ads.mediation:unity:4.19.0.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
    
    // Browser for Apple Sign-In web flow
    implementation 'androidx.browser:browser:1.7.0'

    // In-App Updates
    implementation 'com.google.android.play:app-update:2.1.0'
    implementation 'com.google.android.play:app-update-ktx:2.1.0'

    // Google Play In-App Review
    implementation 'com.google.android.play:review:2.0.2'

    // Cashfree Payments PG Checkout SDK (drop-in checkout, driven by paymentSessionId)
    implementation 'com.cashfree.pg:api:2.5.0'

    // QR scanning (ZXing)
    implementation 'com.google.zxing:core:3.5.2'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    
    // CameraX + ML Kit for license plate scanning
    implementation 'androidx.camera:camera-core:1.4.2'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'androidx.concurrent:concurrent-futures:1.1.0'
    implementation 'com.google.guava:guava:31.1-android'
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.1'
    implementation 'com.google.android.gms:play-services-mlkit-barcode-scanning:18.3.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2023.10.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
